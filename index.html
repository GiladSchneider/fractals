<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractal Explorer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
  }

  #controls {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    background: rgba(15, 15, 25, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 20px;
    width: 260px;
    max-width: calc(100vw - 32px);
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  @media (max-width: 600px) {
    #controls {
      top: 10px;
      left: 10px;
      padding: 14px;
      width: 220px;
      gap: 10px;
    }
    #controls h1 { font-size: 16px; }
    #info { bottom: 10px; left: 10px; }
  }

  #controls h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
  }

  select, input[type=range] {
    width: 100%;
    margin-top: 4px;
  }

  select {
    background: rgba(255, 255, 255, 0.06);
    color: #e0e0e0;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
    cursor: pointer;
    outline: none;
  }

  select:hover { border-color: rgba(255, 255, 255, 0.2); }

  input[type=range] {
    -webkit-appearance: none;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.1);
    outline: none;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #7b8cff;
    cursor: pointer;
  }

  .slider-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .slider-row .value {
    font-size: 13px;
    color: #aaa;
    text-align: right;
  }

  #info {
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 10;
    font-size: 12px;
    color: #555;
    background: rgba(15, 15, 25, 0.7);
    backdrop-filter: blur(8px);
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    line-height: 1.6;
  }

  canvas {
    display: block;
    cursor: crosshair;
    touch-action: none;
  }

  button {
    background: rgba(123, 140, 255, 0.15);
    color: #7b8cff;
    border: 1px solid rgba(123, 140, 255, 0.3);
    border-radius: 6px;
    padding: 8px 0;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }

  button:hover {
    background: rgba(123, 140, 255, 0.25);
  }
</style>
</head>
<body>

<div id="controls">
  <div>
    <label>Fractal Type</label>
    <select id="fractalType">
      <option value="mandelbrot">Mandelbrot Set</option>
      <option value="julia">Julia Set</option>
      <option value="burningship">Burning Ship</option>
      <option value="tricorn">Tricorn</option>
    </select>
  </div>

  <div class="slider-row" id="juliaControls" style="display:none;">
    <label>Julia C (real): <span id="juliaCRVal">-0.7</span></label>
    <input type="range" id="juliaCR" min="-2" max="2" step="0.01" value="-0.7">
    <label>Julia C (imag): <span id="juliaCIVal">0.27</span></label>
    <input type="range" id="juliaCI" min="-2" max="2" step="0.01" value="0.27">
  </div>

  <button id="resetBtn">Reset View</button>
</div>


<canvas id="glCanvas"></canvas>

<script>
// ===================== WebGL setup =====================
const glCanvas = document.getElementById('glCanvas');
const gl = glCanvas.getContext('webgl', { antialias: false, preserveDrawingBuffer: true });

let width, height, dpr;
let view = {};
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let viewStart = {};
let renderQueued = false;

const fractalSelect = document.getElementById('fractalType');
const juliaControls = document.getElementById('juliaControls');
const juliaCR = document.getElementById('juliaCR');
const juliaCI = document.getElementById('juliaCI');
const juliaCRVal = document.getElementById('juliaCRVal');
const juliaCIVal = document.getElementById('juliaCIVal');
const resetBtn = document.getElementById('resetBtn');

const defaults = {
  mandelbrot: { cx: -0.5, cy: 0, scale: 3.5 },
  julia:      { cx: 0, cy: 0, scale: 4 },
  burningship:{ cx: -0.4, cy: -0.6, scale: 4 },
  tricorn:    { cx: -0.5, cy: 0, scale: 3.5 },
};

// ===================== Shaders =====================
const vertSrc = `
attribute vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

// --- Shader 1: Fast single-precision (shallow zoom, all types) ---
const fragSrcFast = `
precision highp float;
uniform vec2 u_resolution;
uniform vec2 u_center;
uniform float u_scale;
uniform int u_maxIter;
uniform int u_type;
uniform vec2 u_juliaC;

vec3 copper(float t) {
  return vec3(min(1.0, t*1.8), min(1.0, t*1.1*0.706), min(1.0, t*0.6*0.471));
}

void main() {
  float aspect = u_resolution.x / u_resolution.y;
  vec2 uv = gl_FragCoord.xy / u_resolution;
  float cr = u_center.x + (uv.x - 0.5) * u_scale * aspect;
  float ci = u_center.y + (0.5 - uv.y) * u_scale;
  float x, y, x2, y2, px, py;
  if (u_type == 1) { x = cr; y = ci; px = u_juliaC.x; py = u_juliaC.y; }
  else { x = 0.0; y = 0.0; px = cr; py = ci; }

  if (u_type == 0) {
    float xm = px - 0.25, py2 = py*py, q = xm*xm + py2;
    if (q*(q+xm) < 0.25*py2) { gl_FragColor = vec4(0,0,0,1); return; }
    if ((px+1.0)*(px+1.0)+py2 < 0.0625) { gl_FragColor = vec4(0,0,0,1); return; }
  }

  int iter = 0;
  float ck_r = 0.0, ck_i = 0.0; int ck_c = 0;
  for (int i = 0; i < 2000; i++) {
    if (i >= u_maxIter) break;
    x2 = x*x; y2 = y*y;
    if (x2+y2 > 4.0) break;
    float ny;
    if (u_type==2) ny = abs(2.0*x*y)+py;
    else if (u_type==3) ny = -2.0*x*y+py;
    else ny = 2.0*x*y+py;
    x = x2-y2+px; y = ny; iter++;
    float dr=x-ck_r, di=y-ck_i;
    if (dr*dr+di*di < 1.0e-12) { iter=u_maxIter; break; }
    ck_c++; if (ck_c>20) { ck_c=0; ck_r=x; ck_i=y; }
  }
  if (iter >= u_maxIter) { gl_FragColor = vec4(0,0,0,1); }
  else {
    float f = float(iter)+1.0-log(log(sqrt(x*x+y*y)))/log(2.0);
    gl_FragColor = vec4(copper(f/float(u_maxIter)), 1.0);
  }
}
`;

// --- Shader 2: Perturbation theory (deep zoom, Mandelbrot & Julia) ---
// ONE reference orbit precomputed on CPU in float64, uploaded as texture.
// Each pixel only computes its tiny delta from the reference in cheap float32.
// Same speed as the fast shader — no df64 overhead.
const fragSrcPerturb = `
precision highp float;
uniform vec2 u_resolution;
uniform float u_pixelScale;
uniform int u_maxIter;
uniform int u_type;
uniform sampler2D u_refOrbit;
uniform float u_orbitLen;
uniform vec2 u_refOffset;

vec3 copper(float t) {
  return vec3(min(1.0, t*1.8), min(1.0, t*1.1*0.706), min(1.0, t*0.6*0.471));
}

void main() {
  float dcr = u_refOffset.x + (gl_FragCoord.x - u_resolution.x * 0.5) * u_pixelScale;
  float dci = u_refOffset.y + (u_resolution.y * 0.5 - gl_FragCoord.y) * u_pixelScale;

  float dr, di;
  if (u_type == 1) { dr = dcr; di = dci; }  // Julia: delta starts at pixel offset
  else { dr = 0.0; di = 0.0; }               // Mandelbrot: delta starts at 0

  float Zr = 0.0, Zi = 0.0;
  int iter = 0;

  for (int i = 0; i < 2000; i++) {
    if (i >= u_maxIter) break;
    if (float(i) >= u_orbitLen) { iter = u_maxIter; break; }

    vec2 Zn = texture2D(u_refOrbit, vec2((float(i)+0.5)/u_orbitLen, 0.5)).xy;
    Zr = Zn.x; Zi = Zn.y;

    float zr = Zr + dr, zi = Zi + di;
    if (zr*zr + zi*zi > 4.0) break;

    // delta_{n+1} = 2*Z_n*delta_n + delta_n^2 [+ delta_c for Mandelbrot]
    float ndr = 2.0*(Zr*dr - Zi*di) + dr*dr - di*di;
    float ndi = 2.0*(Zr*di + Zi*dr) + 2.0*dr*di;
    if (u_type == 0) { ndr += dcr; ndi += dci; }
    dr = ndr; di = ndi;
    iter++;
  }

  if (iter >= u_maxIter) { gl_FragColor = vec4(0,0,0,1); }
  else {
    float zr = Zr+dr, zi = Zi+di;
    float f = float(iter)+1.0-log(log(sqrt(zr*zr+zi*zi)))/log(2.0);
    gl_FragColor = vec4(copper(f/float(u_maxIter)), 1.0);
  }
}
`;

// --- Shader 3: df64 emulated double (deep zoom fallback for Burning Ship, Tricorn) ---
const fragSrcDF64 = `
precision highp float;
uniform vec2 u_resolution;
uniform vec2 u_cx, u_cy, u_pxScale;
uniform int u_maxIter;
uniform int u_type;
uniform vec2 u_juliaC;
uniform float ONE;

vec2 quickTwoSum(float a, float b) {
  float s=a+b; return vec2(s, b-(s*ONE-a)*ONE);
}
vec2 twoSum(float a, float b) {
  float s=a+b, v=(s*ONE-a)*ONE;
  return vec2(s, (a-(s-v)*ONE)*ONE+(b-v));
}
vec2 split_f(float a) {
  float t=a*4097.0, hi=t*ONE-(t-a);
  return vec2(hi, a*ONE-hi);
}
vec2 twoProd(float a, float b) {
  float p=a*b; vec2 sa=split_f(a), sb=split_f(b);
  return vec2(p, ((sa.x*sb.x-p*ONE)+sa.x*sb.y+sa.y*sb.x)+sa.y*sb.y);
}
vec2 df_add(vec2 a, vec2 b) {
  vec2 s=twoSum(a.x,b.x), t=twoSum(a.y,b.y);
  s.y+=t.x; s=quickTwoSum(s.x,s.y); s.y+=t.y; return quickTwoSum(s.x,s.y);
}
vec2 df_sub(vec2 a, vec2 b) { return df_add(a, vec2(-b.x,-b.y)); }
vec2 df_mul(vec2 a, vec2 b) {
  vec2 p=twoProd(a.x,b.x); p.y+=a.x*b.y;
  p=quickTwoSum(p.x,p.y); p.y+=a.y*b.x; return quickTwoSum(p.x,p.y);
}
vec2 df_mul_f(vec2 a, float b) {
  vec2 p=twoProd(a.x,b); p.y+=a.y*b; return quickTwoSum(p.x,p.y);
}

vec3 copper(float t) {
  return vec3(min(1.0, t*1.8), min(1.0, t*1.1*0.706), min(1.0, t*0.6*0.471));
}

void main() {
  vec2 cr = df_add(u_cx, df_mul_f(u_pxScale, gl_FragCoord.x - u_resolution.x*0.5));
  vec2 ci = df_add(u_cy, df_mul_f(u_pxScale, u_resolution.y*0.5 - gl_FragCoord.y));
  vec2 zr, zi, pr, pi;
  if (u_type==1) { zr=cr; zi=ci; pr=vec2(u_juliaC.x,0.0); pi=vec2(u_juliaC.y,0.0); }
  else { zr=vec2(0); zi=vec2(0); pr=cr; pi=ci; }

  int iter=0; float ck_r=0.0, ck_i=0.0; int ck_c=0;
  for (int i=0; i<2000; i++) {
    if (i>=u_maxIter) break;
    if (zr.x*zr.x+zi.x*zi.x > 4.0) break;
    vec2 s=df_add(zr,zi), d=df_sub(zr,zi), zri=df_mul(zr,zi);
    vec2 two_zri = df_add(zri,zri);
    if (u_type==2) { if (two_zri.x<0.0||(two_zri.x==0.0&&two_zri.y<0.0)) two_zri=vec2(-two_zri.x,-two_zri.y); }
    else if (u_type==3) { two_zri=vec2(-two_zri.x,-two_zri.y); }
    zr=df_add(df_mul(s,d),pr); zi=df_add(two_zri,pi); iter++;
    float drc=zr.x-ck_r, dic=zi.x-ck_i;
    if (drc*drc+dic*dic<1.0e-12) { iter=u_maxIter; break; }
    ck_c++; if (ck_c>20) { ck_c=0; ck_r=zr.x; ck_i=zi.x; }
  }
  if (iter>=u_maxIter) { gl_FragColor=vec4(0,0,0,1); }
  else {
    float f=float(iter)+1.0-log(log(sqrt(zr.x*zr.x+zi.x*zi.x)))/log(2.0);
    gl_FragColor=vec4(copper(f/float(u_maxIter)),1.0);
  }
}
`;

// ===================== Compile programs =====================
function compileShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
function createProgram(fragSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(vertSrc, gl.VERTEX_SHADER));
  gl.attachShader(p, compileShader(fragSrc, gl.FRAGMENT_SHADER));
  gl.bindAttribLocation(p, 0, 'a_pos');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}

const progFast = createProgram(fragSrcFast);
const progPerturb = createProgram(fragSrcPerturb);
const progDF64 = createProgram(fragSrcDF64);

const fast = {
  resolution: gl.getUniformLocation(progFast, 'u_resolution'),
  center: gl.getUniformLocation(progFast, 'u_center'),
  scale: gl.getUniformLocation(progFast, 'u_scale'),
  maxIter: gl.getUniformLocation(progFast, 'u_maxIter'),
  type: gl.getUniformLocation(progFast, 'u_type'),
  juliaC: gl.getUniformLocation(progFast, 'u_juliaC'),
};
const perturb = {
  resolution: gl.getUniformLocation(progPerturb, 'u_resolution'),
  pixelScale: gl.getUniformLocation(progPerturb, 'u_pixelScale'),
  maxIter: gl.getUniformLocation(progPerturb, 'u_maxIter'),
  type: gl.getUniformLocation(progPerturb, 'u_type'),
  refOrbit: gl.getUniformLocation(progPerturb, 'u_refOrbit'),
  orbitLen: gl.getUniformLocation(progPerturb, 'u_orbitLen'),
  refOffset: gl.getUniformLocation(progPerturb, 'u_refOffset'),
};
const df64u = {
  resolution: gl.getUniformLocation(progDF64, 'u_resolution'),
  cx: gl.getUniformLocation(progDF64, 'u_cx'),
  cy: gl.getUniformLocation(progDF64, 'u_cy'),
  pxScale: gl.getUniformLocation(progDF64, 'u_pxScale'),
  maxIter: gl.getUniformLocation(progDF64, 'u_maxIter'),
  type: gl.getUniformLocation(progDF64, 'u_type'),
  juliaC: gl.getUniformLocation(progDF64, 'u_juliaC'),
  ONE: gl.getUniformLocation(progDF64, 'ONE'),
};

// Full-screen quad
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const typeMap = { mandelbrot: 0, julia: 1, burningship: 2, tricorn: 3 };

// ===================== Float texture for perturbation =====================
const hasFloatTex = !!gl.getExtension('OES_texture_float');
let orbitTex = null;
if (hasFloatTex) {
  orbitTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, orbitTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

// Compute reference orbit on CPU in float64, return Float32Array for GPU texture
function computeReferenceOrbit(cx, cy, maxIter, type, juliaR, juliaI) {
  let zr, zi, pr, pi;
  if (type === 1) { zr = cx; zi = cy; pr = juliaR; pi = juliaI; }
  else { zr = 0; zi = 0; pr = cx; pi = cy; }

  const data = new Float32Array(maxIter * 4);
  let len = 0;
  for (let i = 0; i < maxIter; i++) {
    data[i * 4] = zr;
    data[i * 4 + 1] = zi;
    // data[i*4+2] and [i*4+3] stay 0 (Float32Array default)
    len = i + 1;
    const zr2 = zr * zr, zi2 = zi * zi;
    if (zr2 + zi2 > 1e16) break;
    const nzi = 2 * zr * zi + pi;
    zr = zr2 - zi2 + pr;
    zi = nzi;
  }
  return { data, length: len };
}

function splitDouble(value) {
  const hi = Math.fround(value);
  return [hi, value - hi];
}

// ===================== Deep zoom CSS transform =====================
// During interaction at deep zoom, CSS-transform the last rendered frame
// instead of re-rendering. This eliminates flickering (no orbit recomputation)
// and lag (CSS transforms are GPU-composited, free). On idle, render the
// actual fractal and clear the transform. This is the standard approach
// used by Google Maps, Kalles Fraktaler, and all tile-based renderers.
let lastRenderedView = null;
let forceRender = false;
let deepIdleTimer = null;

function clearDeepState() {
  lastRenderedView = null;
  glCanvas.style.transform = '';
  clearTimeout(deepIdleTimer);
}

function scheduleDeepRender() {
  clearTimeout(deepIdleTimer);
  deepIdleTimer = setTimeout(() => {
    forceRender = true;
    scheduleRender();
  }, 150);
}

// ===================== Adaptive quality =====================
const DEEP_ZOOM_THRESHOLD = 50000;
const MAX_ZOOM_FACTOR = 1e10;

function needsDeepZoom() {
  const d = defaults[fractalSelect.value];
  return (d.scale / view.scale) > DEEP_ZOOM_THRESHOLD;
}

function computeMaxIter() {
  const d = defaults[fractalSelect.value];
  const zf = d.scale / view.scale;
  return Math.max(200, Math.min(1000, Math.floor(200 + 50 * Math.log2(Math.max(1, zf)))));
}

// ===================== Render =====================

function renderGL() {
  const fractalType = typeMap[fractalSelect.value];
  const juliaR = parseFloat(juliaCR.value);
  const juliaI = parseFloat(juliaCI.value);
  const maxIter = computeMaxIter();
  const deep = needsDeepZoom();

  // During interaction at deep zoom: CSS-transform the last render
  if (deep && lastRenderedView && !forceRender) {
    const s = lastRenderedView.scale / view.scale;
    if (s > 4 || s < 0.25) {
      // CSS scale too extreme — force re-render to limit blur
      forceRender = true;
    } else {
      const tx = (lastRenderedView.cx - view.cx) * height / view.scale;
      const ty = -(lastRenderedView.cy - view.cy) * height / view.scale;
      glCanvas.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
      return;
    }
  }

  // Actual shader render
  forceRender = false;
  glCanvas.style.transform = '';
  gl.viewport(0, 0, glCanvas.width, glCanvas.height);

  if (deep && fractalType <= 1 && hasFloatTex) {
    // --- Perturbation theory: Mandelbrot & Julia at deep zoom ---
    // Fresh orbit at current center — no offset, no precision issues.
    // Only runs on idle or first deep frame, never during active interaction.
    const orbit = computeReferenceOrbit(view.cx, view.cy, maxIter, fractalType, juliaR, juliaI);
    gl.bindTexture(gl.TEXTURE_2D, orbitTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, orbit.length, 1, 0, gl.RGBA, gl.FLOAT,
      orbit.data.subarray(0, orbit.length * 4));

    gl.useProgram(progPerturb);
    gl.uniform2f(perturb.resolution, glCanvas.width, glCanvas.height);
    gl.uniform1f(perturb.pixelScale, view.scale / glCanvas.height);
    gl.uniform1i(perturb.maxIter, maxIter);
    gl.uniform1i(perturb.type, fractalType);
    gl.uniform1f(perturb.orbitLen, orbit.length);
    gl.uniform2f(perturb.refOffset, 0, 0);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, orbitTex);
    gl.uniform1i(perturb.refOrbit, 0);
  } else if (deep) {
    // --- df64 fallback: Burning Ship & Tricorn at deep zoom ---
    gl.useProgram(progDF64);
    gl.uniform2f(df64u.resolution, glCanvas.width, glCanvas.height);
    const [cx_hi, cx_lo] = splitDouble(view.cx);
    const [cy_hi, cy_lo] = splitDouble(view.cy);
    const [ps_hi, ps_lo] = splitDouble(view.scale / glCanvas.height);
    gl.uniform2f(df64u.cx, cx_hi, cx_lo);
    gl.uniform2f(df64u.cy, cy_hi, cy_lo);
    gl.uniform2f(df64u.pxScale, ps_hi, ps_lo);
    gl.uniform1i(df64u.maxIter, maxIter);
    gl.uniform1i(df64u.type, fractalType);
    gl.uniform2f(df64u.juliaC, juliaR, juliaI);
    gl.uniform1f(df64u.ONE, 1.0);
  } else {
    // --- Fast float32: all types at shallow zoom ---
    lastRenderedView = null;
    gl.useProgram(progFast);
    gl.uniform2f(fast.resolution, glCanvas.width, glCanvas.height);
    gl.uniform2f(fast.center, view.cx, view.cy);
    gl.uniform1f(fast.scale, view.scale);
    gl.uniform1i(fast.maxIter, maxIter);
    gl.uniform1i(fast.type, fractalType);
    gl.uniform2f(fast.juliaC, juliaR, juliaI);
  }

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  if (deep) lastRenderedView = { cx: view.cx, cy: view.cy, scale: view.scale };
}

function render() { renderQueued = false; renderGL(); }
function scheduleRender() {
  if (!renderQueued) { renderQueued = true; requestAnimationFrame(render); }
}

// ===================== View =====================
function resetView() {
  const d = defaults[fractalSelect.value];
  view = { cx: d.cx, cy: d.cy, scale: d.scale };
  clearDeepState();
  scheduleRender();
}

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  glCanvas.style.width = width + 'px';
  glCanvas.style.height = height + 'px';
  glCanvas.width = Math.round(width * dpr);
  glCanvas.height = Math.round(height * dpr);
  clearDeepState();
  scheduleRender();
}

function screenToFractal(sx, sy) {
  const aspect = width / height;
  return {
    r: view.cx + (sx / width - 0.5) * view.scale * aspect,
    i: view.cy + (sy / height - 0.5) * view.scale,
  };
}

// ===================== Mouse interaction =====================
glCanvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  let delta = e.deltaY;
  if (e.deltaMode === 1) delta *= 40;
  if (e.deltaMode === 2) delta *= 800;
  const zoom = Math.pow(1.02, delta);
  const minScale = defaults[fractalSelect.value].scale / MAX_ZOOM_FACTOR;
  if (view.scale <= minScale && zoom < 1) return;
  const aspect = width / height;
  const pt = screenToFractal(e.clientX, e.clientY);
  view.scale = Math.max(view.scale * zoom, minScale);
  view.cx = pt.r - (e.clientX / width - 0.5) * view.scale * aspect;
  view.cy = pt.i - (e.clientY / height - 0.5) * view.scale;
  scheduleDeepRender();
  scheduleRender();
}, { passive: false });

glCanvas.addEventListener('mousedown', (e) => {
  isDragging = true;
  dragStart = { x: e.clientX, y: e.clientY };
  viewStart = { cx: view.cx, cy: view.cy };
  glCanvas.style.cursor = 'grabbing';
});
glCanvas.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const aspect = width / height;
  view.cx = viewStart.cx - ((e.clientX - dragStart.x) / width) * view.scale * aspect;
  view.cy = viewStart.cy - ((e.clientY - dragStart.y) / height) * view.scale;
  scheduleDeepRender();
  scheduleRender();
});
glCanvas.addEventListener('mouseup', () => { isDragging = false; glCanvas.style.cursor = 'crosshair'; });
glCanvas.addEventListener('mouseleave', () => { isDragging = false; glCanvas.style.cursor = 'crosshair'; });

// ===================== Touch interaction =====================
let lastTouchDist = 0;
let lastTouchCenter = { x: 0, y: 0 };
let touchDragging = false;

glCanvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (e.touches.length === 1) {
    touchDragging = true;
    dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    viewStart = { cx: view.cx, cy: view.cy };
  } else if (e.touches.length === 2) {
    touchDragging = false;
    const t0 = e.touches[0], t1 = e.touches[1];
    lastTouchDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    lastTouchCenter = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
    viewStart = { cx: view.cx, cy: view.cy, scale: view.scale };
  }
}, { passive: false });

glCanvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 1 && touchDragging) {
    const aspect = width / height;
    view.cx = viewStart.cx - ((e.touches[0].clientX - dragStart.x) / width) * view.scale * aspect;
    view.cy = viewStart.cy - ((e.touches[0].clientY - dragStart.y) / height) * view.scale;
    scheduleDeepRender();
    scheduleRender();
  } else if (e.touches.length === 2) {
    const t0 = e.touches[0], t1 = e.touches[1];
    const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    const cx = (t0.clientX + t1.clientX) / 2, cy = (t0.clientY + t1.clientY) / 2;
    const aspect = width / height;
    const pt = {
      r: viewStart.cx + (lastTouchCenter.x / width - 0.5) * viewStart.scale * aspect,
      i: viewStart.cy + (lastTouchCenter.y / height - 0.5) * viewStart.scale,
    };
    const minScale = defaults[fractalSelect.value].scale / MAX_ZOOM_FACTOR;
    const newScale = Math.max(viewStart.scale * (lastTouchDist / dist), minScale);
    if (newScale <= minScale && newScale < view.scale) return;
    view.scale = newScale;
    view.cx = pt.r - (cx / width - 0.5) * view.scale * aspect;
    view.cy = pt.i - (cy / height - 0.5) * view.scale;
    scheduleDeepRender();
    scheduleRender();
  }
}, { passive: false });

glCanvas.addEventListener('touchend', (e) => {
  if (e.touches.length === 0) touchDragging = false;
  if (e.touches.length === 1) {
    touchDragging = true;
    dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    viewStart = { cx: view.cx, cy: view.cy };
  }
});

// ===================== Controls =====================
fractalSelect.addEventListener('change', () => {
  juliaControls.style.display = fractalSelect.value === 'julia' ? 'flex' : 'none';
  resetView();
});
juliaCR.addEventListener('input', () => { juliaCRVal.textContent = juliaCR.value; clearDeepState(); scheduleRender(); });
juliaCI.addEventListener('input', () => { juliaCIVal.textContent = juliaCI.value; clearDeepState(); scheduleRender(); });
resetBtn.addEventListener('click', resetView);
window.addEventListener('resize', resize);

// ===================== Init =====================
resize();
resetView();
</script>
</body>
