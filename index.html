<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractal Explorer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
  }

  #controls {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    background: rgba(15, 15, 25, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 20px;
    width: 260px;
    max-width: calc(100vw - 32px);
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  @media (max-width: 600px) {
    #controls {
      top: 10px;
      left: 10px;
      padding: 14px;
      width: 220px;
      gap: 10px;
    }
    #controls h1 { font-size: 16px; }
    #info { bottom: 10px; left: 10px; }
  }

  #controls h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
  }

  select, input[type=range] {
    width: 100%;
    margin-top: 4px;
  }

  select {
    background: rgba(255, 255, 255, 0.06);
    color: #e0e0e0;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
    cursor: pointer;
    outline: none;
  }

  select:hover { border-color: rgba(255, 255, 255, 0.2); }

  input[type=range] {
    -webkit-appearance: none;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.1);
    outline: none;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #7b8cff;
    cursor: pointer;
  }

  .slider-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .slider-row .value {
    font-size: 13px;
    color: #aaa;
    text-align: right;
  }

  #info {
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 10;
    font-size: 12px;
    color: #555;
    background: rgba(15, 15, 25, 0.7);
    backdrop-filter: blur(8px);
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    line-height: 1.6;
  }

  canvas {
    display: block;
    cursor: crosshair;
    touch-action: none;
  }

  button {
    background: rgba(123, 140, 255, 0.15);
    color: #7b8cff;
    border: 1px solid rgba(123, 140, 255, 0.3);
    border-radius: 6px;
    padding: 8px 0;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }

  button:hover {
    background: rgba(123, 140, 255, 0.25);
  }
</style>
</head>
<body>

<div id="controls">
  <div>
    <label>Fractal Type</label>
    <select id="fractalType">
      <option value="mandelbrot">Mandelbrot Set</option>
      <option value="julia">Julia Set</option>
      <option value="burningship">Burning Ship</option>
      <option value="tricorn">Tricorn</option>
    </select>
  </div>

  <div class="slider-row" id="juliaControls" style="display:none;">
    <label>Julia C (real): <span id="juliaCRVal">-0.7</span></label>
    <input type="range" id="juliaCR" min="-2" max="2" step="0.01" value="-0.7">
    <label>Julia C (imag): <span id="juliaCIVal">0.27</span></label>
    <input type="range" id="juliaCI" min="-2" max="2" step="0.01" value="0.27">
  </div>

  <button id="resetBtn">Reset View</button>
</div>

<div id="info">
  Scroll or pinch to zoom &middot; Drag to pan
</div>

<canvas id="glCanvas"></canvas>

<script>
// ===================== WebGL setup =====================
const glCanvas = document.getElementById('glCanvas');
const gl = glCanvas.getContext('webgl', { antialias: false, preserveDrawingBuffer: false });

let width, height;
let view = {};
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let viewStart = {};
let renderQueued = false;

const fractalSelect = document.getElementById('fractalType');
const juliaControls = document.getElementById('juliaControls');
const juliaCR = document.getElementById('juliaCR');
const juliaCI = document.getElementById('juliaCI');
const juliaCRVal = document.getElementById('juliaCRVal');
const juliaCIVal = document.getElementById('juliaCIVal');
const resetBtn = document.getElementById('resetBtn');

const defaults = {
  mandelbrot: { cx: -0.5, cy: 0, scale: 3.5 },
  julia:      { cx: 0, cy: 0, scale: 4 },
  burningship:{ cx: -0.4, cy: -0.6, scale: 4 },
  tricorn:    { cx: -0.5, cy: 0, scale: 3.5 },
};

// ===================== Shaders =====================
const vertSrc = `
attribute vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

// Fragment shader: handles all 4 escape-time fractals + copper palette
const fragSrc = `
precision highp float;
uniform vec2 u_resolution;
uniform vec2 u_center;
uniform float u_scale;
uniform int u_maxIter;
uniform int u_type; // 0=mandelbrot, 1=julia, 2=burningship, 3=tricorn
uniform vec2 u_juliaC;

vec3 copper(float t) {
  return vec3(
    min(1.0, t * 1.8),
    min(1.0, t * 1.1 * 0.706),
    min(1.0, t * 0.6 * 0.471)
  );
}

void main() {
  float aspect = u_resolution.x / u_resolution.y;
  vec2 uv = gl_FragCoord.xy / u_resolution;
  float cr = u_center.x + (uv.x - 0.5) * u_scale * aspect;
  float ci = u_center.y + (0.5 - uv.y) * u_scale; // flip y

  float x, y, x2, y2;
  float px, py;

  // Init based on type
  if (u_type == 1) { // julia
    x = cr; y = ci;
    px = u_juliaC.x; py = u_juliaC.y;
  } else {
    x = 0.0; y = 0.0;
    px = cr; py = ci;
  }

  int iter = 0;
  for (int i = 0; i < 1000; i++) {
    if (i >= u_maxIter) break;
    x2 = x * x;
    y2 = y * y;
    if (x2 + y2 > 4.0) break;

    float ny;
    if (u_type == 2) { // burning ship
      ny = abs(2.0 * x * y) + py;
    } else if (u_type == 3) { // tricorn
      ny = -2.0 * x * y + py;
    } else { // mandelbrot & julia
      ny = 2.0 * x * y + py;
    }
    x = x2 - y2 + px;
    y = ny;
    iter++;
  }

  if (iter >= u_maxIter) {
    gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
  } else {
    // Smooth iteration count for smoother coloring
    float fIter = float(iter) + 1.0 - log(log(sqrt(x*x + y*y))) / log(2.0);
    float t = fIter / float(u_maxIter);
    gl_FragColor = vec4(copper(t), 1.0);
  }
}
`;

function compileShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compileShader(vertSrc, gl.VERTEX_SHADER));
gl.attachShader(prog, compileShader(fragSrc, gl.FRAGMENT_SHADER));
gl.linkProgram(prog);
gl.useProgram(prog);

// Full-screen quad
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

// Uniform locations
const uResolution = gl.getUniformLocation(prog, 'u_resolution');
const uCenter = gl.getUniformLocation(prog, 'u_center');
const uScale = gl.getUniformLocation(prog, 'u_scale');
const uMaxIter = gl.getUniformLocation(prog, 'u_maxIter');
const uType = gl.getUniformLocation(prog, 'u_type');
const uJuliaC = gl.getUniformLocation(prog, 'u_juliaC');

const typeMap = { mandelbrot: 0, julia: 1, burningship: 2, tricorn: 3 };

function renderGL() {
  gl.viewport(0, 0, glCanvas.width, glCanvas.height);
  gl.uniform2f(uResolution, glCanvas.width, glCanvas.height);
  gl.uniform2f(uCenter, view.cx, view.cy);
  gl.uniform1f(uScale, view.scale);
  gl.uniform1i(uMaxIter, 1000);
  gl.uniform1i(uType, typeMap[fractalSelect.value]);
  gl.uniform2f(uJuliaC, parseFloat(juliaCR.value), parseFloat(juliaCI.value));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ===================== Render =====================
function render() {
  renderQueued = false;
  renderGL();
}

function scheduleRender() {
  if (!renderQueued) {
    renderQueued = true;
    requestAnimationFrame(render);
  }
}

// ===================== View =====================
function resetView() {
  const d = defaults[fractalSelect.value];
  view = { cx: d.cx, cy: d.cy, scale: d.scale };
  scheduleRender();
}

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  glCanvas.width = width * dpr;
  glCanvas.height = height * dpr;
  glCanvas.style.width = width + 'px';
  glCanvas.style.height = height + 'px';
  scheduleRender();
}

// ===================== Coordinate helpers =====================
// Maps screen (clientX, clientY) to fractal (real, imag).
// Shader: uv = gl_FragCoord.xy / resolution, with gl_FragCoord.y=0 at bottom.
//   cr = cx + (uv.x - 0.5) * scale * aspect
//   ci = cy + (0.5 - uv.y) * scale
// gl_FragCoord.y ≈ height - clientY, so uv.y = 1 - clientY/height
//   ci = cy + (0.5 - (1 - clientY/height)) * scale = cy + (clientY/height - 0.5) * scale
function screenToFractal(sx, sy) {
  const aspect = width / height;
  return {
    r: view.cx + (sx / width - 0.5) * view.scale * aspect,
    i: view.cy + (sy / height - 0.5) * view.scale,
  };
}

// ===================== Mouse interaction =====================
glCanvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoom = e.deltaY > 0 ? 1.04 : 0.962;
  const aspect = width / height;
  const pt = screenToFractal(e.clientX, e.clientY);
  view.scale *= zoom;
  view.cx = pt.r - (e.clientX / width - 0.5) * view.scale * aspect;
  view.cy = pt.i - (e.clientY / height - 0.5) * view.scale;
  scheduleRender();
}, { passive: false });

glCanvas.addEventListener('mousedown', (e) => {
  isDragging = true;
  dragStart = { x: e.clientX, y: e.clientY };
  viewStart = { cx: view.cx, cy: view.cy };
  glCanvas.style.cursor = 'grabbing';
});

glCanvas.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const aspect = width / height;
  view.cx = viewStart.cx - ((e.clientX - dragStart.x) / width) * view.scale * aspect;
  view.cy = viewStart.cy - ((e.clientY - dragStart.y) / height) * view.scale;
  scheduleRender();
});

glCanvas.addEventListener('mouseup', () => { isDragging = false; glCanvas.style.cursor = 'crosshair'; });
glCanvas.addEventListener('mouseleave', () => { isDragging = false; glCanvas.style.cursor = 'crosshair'; });

// ===================== Touch interaction =====================
let lastTouchDist = 0;
let lastTouchCenter = { x: 0, y: 0 };
let touchDragging = false;

glCanvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (e.touches.length === 1) {
    touchDragging = true;
    dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    viewStart = { cx: view.cx, cy: view.cy };
  } else if (e.touches.length === 2) {
    touchDragging = false;
    const t0 = e.touches[0], t1 = e.touches[1];
    lastTouchDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    lastTouchCenter = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
    viewStart = { cx: view.cx, cy: view.cy, scale: view.scale };
  }
}, { passive: false });

glCanvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 1 && touchDragging) {
    const aspect = width / height;
    view.cx = viewStart.cx - ((e.touches[0].clientX - dragStart.x) / width) * view.scale * aspect;
    view.cy = viewStart.cy - ((e.touches[0].clientY - dragStart.y) / height) * view.scale;
    scheduleRender();
  } else if (e.touches.length === 2) {
    const t0 = e.touches[0], t1 = e.touches[1];
    const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    const cx = (t0.clientX + t1.clientX) / 2, cy = (t0.clientY + t1.clientY) / 2;
    const aspect = width / height;

    // Zoom: anchor on the initial pinch center
    const pt = {
      r: viewStart.cx + (lastTouchCenter.x / width - 0.5) * viewStart.scale * aspect,
      i: viewStart.cy + (lastTouchCenter.y / height - 0.5) * viewStart.scale,
    };
    const newScale = viewStart.scale * (lastTouchDist / dist);
    view.scale = newScale;
    view.cx = pt.r - (cx / width - 0.5) * newScale * aspect;
    view.cy = pt.i - (cy / height - 0.5) * newScale;
    scheduleRender();
  }
}, { passive: false });

glCanvas.addEventListener('touchend', (e) => {
  if (e.touches.length === 0) touchDragging = false;
  // If going from 2 fingers to 1, restart single-finger drag
  if (e.touches.length === 1) {
    touchDragging = true;
    dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    viewStart = { cx: view.cx, cy: view.cy };
  }
});

// ===================== Controls =====================
fractalSelect.addEventListener('change', () => {
  juliaControls.style.display = fractalSelect.value === 'julia' ? 'flex' : 'none';
  resetView();
});

juliaCR.addEventListener('input', () => { juliaCRVal.textContent = juliaCR.value; scheduleRender(); });
juliaCI.addEventListener('input', () => { juliaCIVal.textContent = juliaCI.value; scheduleRender(); });
resetBtn.addEventListener('click', resetView);
window.addEventListener('resize', resize);

// ===================== Init =====================
resize();
resetView();
</script>
</body>
</html>
