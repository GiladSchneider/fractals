<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractal Explorer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
  }

  #controls {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    background: rgba(15, 15, 25, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 20px;
    width: 260px;
    max-width: calc(100vw - 32px);
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  @media (max-width: 600px) {
    #controls {
      top: 10px;
      left: 10px;
      padding: 14px;
      width: 220px;
      gap: 10px;
    }
    #controls h1 { font-size: 16px; }
    #info { bottom: 10px; left: 10px; }
  }

  #controls h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
  }

  select, input[type=range] {
    width: 100%;
    margin-top: 4px;
  }

  select {
    background: rgba(255, 255, 255, 0.06);
    color: #e0e0e0;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
    cursor: pointer;
    outline: none;
  }

  select:hover { border-color: rgba(255, 255, 255, 0.2); }

  input[type=range] {
    -webkit-appearance: none;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.1);
    outline: none;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #7b8cff;
    cursor: pointer;
  }

  .slider-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .slider-row .value {
    font-size: 13px;
    color: #aaa;
    text-align: right;
  }

  #info {
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 10;
    font-size: 12px;
    color: #555;
    background: rgba(15, 15, 25, 0.7);
    backdrop-filter: blur(8px);
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    line-height: 1.6;
  }

  canvas {
    display: block;
    cursor: crosshair;
    touch-action: none;
  }

  button {
    background: rgba(123, 140, 255, 0.15);
    color: #7b8cff;
    border: 1px solid rgba(123, 140, 255, 0.3);
    border-radius: 6px;
    padding: 8px 0;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }

  button:hover {
    background: rgba(123, 140, 255, 0.25);
  }
</style>
</head>
<body>

<div id="controls">
  <div>
    <label>Fractal Type</label>
    <select id="fractalType">
      <option value="mandelbrot">Mandelbrot Set</option>
      <option value="julia">Julia Set</option>
      <option value="burningship">Burning Ship</option>
      <option value="tricorn">Tricorn</option>
    </select>
  </div>

  <div class="slider-row" id="juliaControls" style="display:none;">
    <label>Julia C (real): <span id="juliaCRVal">-0.7</span></label>
    <input type="range" id="juliaCR" min="-2" max="2" step="0.01" value="-0.7">
    <label>Julia C (imag): <span id="juliaCIVal">0.27</span></label>
    <input type="range" id="juliaCI" min="-2" max="2" step="0.01" value="0.27">
  </div>

  <button id="resetBtn">Reset View</button>
</div>


<canvas id="glCanvas"></canvas>

<script>
// ===================== WebGL setup =====================
const glCanvas = document.getElementById('glCanvas');
const gl = glCanvas.getContext('webgl', { antialias: false, preserveDrawingBuffer: false });

let width, height, dpr;
let view = {};
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let viewStart = {};
let renderQueued = false;

const fractalSelect = document.getElementById('fractalType');
const juliaControls = document.getElementById('juliaControls');
const juliaCR = document.getElementById('juliaCR');
const juliaCI = document.getElementById('juliaCI');
const juliaCRVal = document.getElementById('juliaCRVal');
const juliaCIVal = document.getElementById('juliaCIVal');
const resetBtn = document.getElementById('resetBtn');

const defaults = {
  mandelbrot: { cx: -0.5, cy: 0, scale: 3.5 },
  julia:      { cx: 0, cy: 0, scale: 4 },
  burningship:{ cx: -0.4, cy: -0.6, scale: 4 },
  tricorn:    { cx: -0.5, cy: 0, scale: 3.5 },
};

// ===================== Shaders =====================
const vertSrc = `
attribute vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

// --- Fast single-precision shader (shallow zoom, 60fps) ---
// Optimizations: cardioid/bulb skip, periodicity checking
const fragSrcFast = `
precision highp float;
uniform vec2 u_resolution;
uniform vec2 u_center;
uniform float u_scale;
uniform int u_maxIter;
uniform int u_type;
uniform vec2 u_juliaC;

vec3 copper(float t) {
  return vec3(
    min(1.0, t * 1.8),
    min(1.0, t * 1.1 * 0.706),
    min(1.0, t * 0.6 * 0.471)
  );
}

void main() {
  float aspect = u_resolution.x / u_resolution.y;
  vec2 uv = gl_FragCoord.xy / u_resolution;
  float cr = u_center.x + (uv.x - 0.5) * u_scale * aspect;
  float ci = u_center.y + (0.5 - uv.y) * u_scale;

  float x, y, x2, y2;
  float px, py;

  if (u_type == 1) {
    x = cr; y = ci;
    px = u_juliaC.x; py = u_juliaC.y;
  } else {
    x = 0.0; y = 0.0;
    px = cr; py = ci;
  }

  // Cardioid and period-2 bulb check — skip iteration for known-interior points
  if (u_type == 0) {
    float xm = px - 0.25;
    float py2 = py * py;
    float q = xm * xm + py2;
    if (q * (q + xm) < 0.25 * py2) {
      gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
      return;
    }
    if ((px + 1.0) * (px + 1.0) + py2 < 0.0625) {
      gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
      return;
    }
  }

  int iter = 0;
  float check_r = 0.0, check_i = 0.0;
  int check_count = 0;

  for (int i = 0; i < 2000; i++) {
    if (i >= u_maxIter) break;
    x2 = x * x;
    y2 = y * y;
    if (x2 + y2 > 4.0) break;

    float ny;
    if (u_type == 2) {
      ny = abs(2.0 * x * y) + py;
    } else if (u_type == 3) {
      ny = -2.0 * x * y + py;
    } else {
      ny = 2.0 * x * y + py;
    }
    x = x2 - y2 + px;
    y = ny;
    iter++;

    // Periodicity check — detect cyclic orbits and bail out early
    float dr = x - check_r;
    float di = y - check_i;
    if (dr * dr + di * di < 1.0e-12) {
      iter = u_maxIter;
      break;
    }
    check_count++;
    if (check_count > 20) {
      check_count = 0;
      check_r = x;
      check_i = y;
    }
  }

  if (iter >= u_maxIter) {
    gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
  } else {
    float fIter = float(iter) + 1.0 - log(log(sqrt(x*x + y*y))) / log(2.0);
    float t = fIter / float(u_maxIter);
    gl_FragColor = vec4(copper(t), 1.0);
  }
}
`;

// --- df64 emulated double-precision shader (deep zoom) ---
// Optimizations: 2-multiply iteration, cardioid/bulb skip, periodicity checking
const fragSrcDF64 = `
precision highp float;
uniform vec2 u_resolution;
uniform vec2 u_cx, u_cy, u_pxScale;
uniform int u_maxIter;
uniform int u_type;
uniform vec2 u_juliaC;
uniform float ONE;

// ---- df64 primitives ----

vec2 quickTwoSum(float a, float b) {
  float s = a + b;
  float e = b - (s * ONE - a) * ONE;
  return vec2(s, e);
}

vec2 twoSum(float a, float b) {
  float s = a + b;
  float v = (s * ONE - a) * ONE;
  float e = (a - (s - v) * ONE) * ONE + (b - v);
  return vec2(s, e);
}

vec2 split_f(float a) {
  const float SPLIT = 4097.0;
  float t = a * SPLIT;
  float hi = t * ONE - (t - a);
  float lo = a * ONE - hi;
  return vec2(hi, lo);
}

vec2 twoProd(float a, float b) {
  float p = a * b;
  vec2 sa = split_f(a);
  vec2 sb = split_f(b);
  float err = ((sa.x * sb.x - p * ONE) + sa.x * sb.y + sa.y * sb.x) + sa.y * sb.y;
  return vec2(p, err);
}

vec2 df_add(vec2 a, vec2 b) {
  vec2 s = twoSum(a.x, b.x);
  vec2 t = twoSum(a.y, b.y);
  s.y += t.x;
  s = quickTwoSum(s.x, s.y);
  s.y += t.y;
  s = quickTwoSum(s.x, s.y);
  return s;
}

vec2 df_sub(vec2 a, vec2 b) {
  return df_add(a, vec2(-b.x, -b.y));
}

vec2 df_mul(vec2 a, vec2 b) {
  vec2 p = twoProd(a.x, b.x);
  p.y += a.x * b.y;
  p = quickTwoSum(p.x, p.y);
  p.y += a.y * b.x;
  p = quickTwoSum(p.x, p.y);
  return p;
}

vec2 df_mul_f(vec2 a, float b) {
  vec2 p = twoProd(a.x, b);
  p.y += a.y * b;
  p = quickTwoSum(p.x, p.y);
  return p;
}

vec3 copper(float t) {
  return vec3(
    min(1.0, t * 1.8),
    min(1.0, t * 1.1 * 0.706),
    min(1.0, t * 0.6 * 0.471)
  );
}

void main() {
  float dx = gl_FragCoord.x - u_resolution.x * 0.5;
  float dy = u_resolution.y * 0.5 - gl_FragCoord.y;
  vec2 cr = df_add(u_cx, df_mul_f(u_pxScale, dx));
  vec2 ci = df_add(u_cy, df_mul_f(u_pxScale, dy));

  vec2 zr, zi, pr, pi;

  if (u_type == 1) {
    zr = cr; zi = ci;
    pr = vec2(u_juliaC.x, 0.0);
    pi = vec2(u_juliaC.y, 0.0);
  } else {
    zr = vec2(0.0, 0.0); zi = vec2(0.0, 0.0);
    pr = cr; pi = ci;
  }

  // Cardioid/bulb skip (Mandelbrot only, float32 hi parts suffice)
  if (u_type == 0) {
    float xm = pr.x - 0.25;
    float py2 = pi.x * pi.x;
    float q = xm * xm + py2;
    if (q * (q + xm) < 0.25 * py2) {
      gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
      return;
    }
    if ((pr.x + 1.0) * (pr.x + 1.0) + py2 < 0.0625) {
      gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
      return;
    }
  }

  int iter = 0;
  float check_r = 0.0, check_i = 0.0;
  int check_count = 0;

  for (int i = 0; i < 2000; i++) {
    if (i >= u_maxIter) break;

    // Escape check — float32 hi parts are accurate enough for |z|>2
    if (zr.x * zr.x + zi.x * zi.x > 4.0) break;

    // 2-multiply optimization: (zr+zi)*(zr-zi) = zr²-zi² saves one df_mul
    vec2 s = df_add(zr, zi);
    vec2 d = df_sub(zr, zi);
    vec2 zri = df_mul(zr, zi);
    vec2 two_zri = df_add(zri, zri);

    if (u_type == 2) { // Burning Ship: abs(2*zr*zi)
      if (two_zri.x < 0.0 || (two_zri.x == 0.0 && two_zri.y < 0.0))
        two_zri = vec2(-two_zri.x, -two_zri.y);
    } else if (u_type == 3) { // Tricorn: -(2*zr*zi)
      two_zri = vec2(-two_zri.x, -two_zri.y);
    }

    zr = df_add(df_mul(s, d), pr);  // zr²-zi² + pr
    zi = df_add(two_zri, pi);       // 2*zr*zi + pi
    iter++;

    // Periodicity check — detect cyclic orbits using float32 hi parts
    float drc = zr.x - check_r;
    float dic = zi.x - check_i;
    if (drc * drc + dic * dic < 1.0e-12) {
      iter = u_maxIter;
      break;
    }
    check_count++;
    if (check_count > 20) {
      check_count = 0;
      check_r = zr.x;
      check_i = zi.x;
    }
  }

  if (iter >= u_maxIter) {
    gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
  } else {
    float fIter = float(iter) + 1.0 - log(log(sqrt(zr.x*zr.x + zi.x*zi.x))) / log(2.0);
    float t = fIter / float(u_maxIter);
    gl_FragColor = vec4(copper(t), 1.0);
  }
}
`;

// ===================== Compile & link both programs =====================
function compileShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
  }
  return s;
}

function createProgram(fragSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(vertSrc, gl.VERTEX_SHADER));
  gl.attachShader(p, compileShader(fragSrc, gl.FRAGMENT_SHADER));
  gl.bindAttribLocation(p, 0, 'a_pos');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p));
  }
  return p;
}

const progFast = createProgram(fragSrcFast);
const progDF64 = createProgram(fragSrcDF64);

// Uniform locations — fast program
const fast = {
  resolution: gl.getUniformLocation(progFast, 'u_resolution'),
  center:     gl.getUniformLocation(progFast, 'u_center'),
  scale:      gl.getUniformLocation(progFast, 'u_scale'),
  maxIter:    gl.getUniformLocation(progFast, 'u_maxIter'),
  type:       gl.getUniformLocation(progFast, 'u_type'),
  juliaC:     gl.getUniformLocation(progFast, 'u_juliaC'),
};

// Uniform locations — df64 program
const df64 = {
  resolution: gl.getUniformLocation(progDF64, 'u_resolution'),
  cx:         gl.getUniformLocation(progDF64, 'u_cx'),
  cy:         gl.getUniformLocation(progDF64, 'u_cy'),
  pxScale:    gl.getUniformLocation(progDF64, 'u_pxScale'),
  maxIter:    gl.getUniformLocation(progDF64, 'u_maxIter'),
  type:       gl.getUniformLocation(progDF64, 'u_type'),
  juliaC:     gl.getUniformLocation(progDF64, 'u_juliaC'),
  ONE:        gl.getUniformLocation(progDF64, 'ONE'),
};

// Full-screen quad (shared via attribute location 0)
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const typeMap = { mandelbrot: 0, julia: 1, burningship: 2, tricorn: 3 };

// Split a JS float64 into two float32s: hi + lo ≈ value
function splitDouble(value) {
  const hi = Math.fround(value);
  const lo = value - hi;
  return [hi, lo];
}

// ===================== Adaptive quality =====================

const DF64_ZOOM_THRESHOLD = 50000;

function needsDF64() {
  const d = defaults[fractalSelect.value];
  return (d.scale / view.scale) > DF64_ZOOM_THRESHOLD;
}

// Scale iterations with zoom depth — no point running 2000 iterations at 1x zoom
function computeMaxIter() {
  const d = defaults[fractalSelect.value];
  const zoomFactor = d.scale / view.scale;
  return Math.max(200, Math.min(2000,
    Math.floor(200 + 50 * Math.log2(Math.max(1, zoomFactor)))
  ));
}

// ===================== Render =====================

function renderGL() {
  const fractalType = typeMap[fractalSelect.value];
  const juliaR = parseFloat(juliaCR.value);
  const juliaI = parseFloat(juliaCI.value);
  const maxIter = computeMaxIter();

  gl.viewport(0, 0, glCanvas.width, glCanvas.height);

  if (needsDF64()) {
    gl.useProgram(progDF64);
    gl.uniform2f(df64.resolution, glCanvas.width, glCanvas.height);

    const [cx_hi, cx_lo] = splitDouble(view.cx);
    const [cy_hi, cy_lo] = splitDouble(view.cy);
    const pixelScale = view.scale / glCanvas.height;
    const [ps_hi, ps_lo] = splitDouble(pixelScale);

    gl.uniform2f(df64.cx, cx_hi, cx_lo);
    gl.uniform2f(df64.cy, cy_hi, cy_lo);
    gl.uniform2f(df64.pxScale, ps_hi, ps_lo);
    gl.uniform1i(df64.maxIter, maxIter);
    gl.uniform1i(df64.type, fractalType);
    gl.uniform2f(df64.juliaC, juliaR, juliaI);
    gl.uniform1f(df64.ONE, 1.0);
  } else {
    gl.useProgram(progFast);
    gl.uniform2f(fast.resolution, glCanvas.width, glCanvas.height);
    gl.uniform2f(fast.center, view.cx, view.cy);
    gl.uniform1f(fast.scale, view.scale);
    gl.uniform1i(fast.maxIter, maxIter);
    gl.uniform1i(fast.type, fractalType);
    gl.uniform2f(fast.juliaC, juliaR, juliaI);
  }

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function render() {
  renderQueued = false;
  renderGL();
}

function scheduleRender() {
  if (!renderQueued) {
    renderQueued = true;
    requestAnimationFrame(render);
  }
}

// ===================== View =====================
function resetView() {
  const d = defaults[fractalSelect.value];
  view = { cx: d.cx, cy: d.cy, scale: d.scale };
  scheduleRender();
}

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  glCanvas.style.width = width + 'px';
  glCanvas.style.height = height + 'px';
  glCanvas.width = Math.round(width * dpr);
  glCanvas.height = Math.round(height * dpr);
  scheduleRender();
}

// ===================== Coordinate helpers =====================
function screenToFractal(sx, sy) {
  const aspect = width / height;
  return {
    r: view.cx + (sx / width - 0.5) * view.scale * aspect,
    i: view.cy + (sy / height - 0.5) * view.scale,
  };
}

// ===================== Mouse interaction =====================
glCanvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  let delta = e.deltaY;
  if (e.deltaMode === 1) delta *= 40;
  if (e.deltaMode === 2) delta *= 800;
  const zoom = Math.pow(1.02, delta);
  const aspect = width / height;
  const pt = screenToFractal(e.clientX, e.clientY);
  view.scale *= zoom;
  view.cx = pt.r - (e.clientX / width - 0.5) * view.scale * aspect;
  view.cy = pt.i - (e.clientY / height - 0.5) * view.scale;
  scheduleRender();
}, { passive: false });

glCanvas.addEventListener('mousedown', (e) => {
  isDragging = true;
  dragStart = { x: e.clientX, y: e.clientY };
  viewStart = { cx: view.cx, cy: view.cy };
  glCanvas.style.cursor = 'grabbing';
});

glCanvas.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const aspect = width / height;
  view.cx = viewStart.cx - ((e.clientX - dragStart.x) / width) * view.scale * aspect;
  view.cy = viewStart.cy - ((e.clientY - dragStart.y) / height) * view.scale;
  scheduleRender();
});

glCanvas.addEventListener('mouseup', () => { isDragging = false; glCanvas.style.cursor = 'crosshair'; });
glCanvas.addEventListener('mouseleave', () => { isDragging = false; glCanvas.style.cursor = 'crosshair'; });

// ===================== Touch interaction =====================
let lastTouchDist = 0;
let lastTouchCenter = { x: 0, y: 0 };
let touchDragging = false;

glCanvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (e.touches.length === 1) {
    touchDragging = true;
    dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    viewStart = { cx: view.cx, cy: view.cy };
  } else if (e.touches.length === 2) {
    touchDragging = false;
    const t0 = e.touches[0], t1 = e.touches[1];
    lastTouchDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    lastTouchCenter = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
    viewStart = { cx: view.cx, cy: view.cy, scale: view.scale };
  }
}, { passive: false });

glCanvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 1 && touchDragging) {
    const aspect = width / height;
    view.cx = viewStart.cx - ((e.touches[0].clientX - dragStart.x) / width) * view.scale * aspect;
    view.cy = viewStart.cy - ((e.touches[0].clientY - dragStart.y) / height) * view.scale;
    scheduleRender();
  } else if (e.touches.length === 2) {
    const t0 = e.touches[0], t1 = e.touches[1];
    const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    const cx = (t0.clientX + t1.clientX) / 2, cy = (t0.clientY + t1.clientY) / 2;
    const aspect = width / height;

    const pt = {
      r: viewStart.cx + (lastTouchCenter.x / width - 0.5) * viewStart.scale * aspect,
      i: viewStart.cy + (lastTouchCenter.y / height - 0.5) * viewStart.scale,
    };
    const newScale = viewStart.scale * (lastTouchDist / dist);
    view.scale = newScale;
    view.cx = pt.r - (cx / width - 0.5) * newScale * aspect;
    view.cy = pt.i - (cy / height - 0.5) * newScale;
    scheduleRender();
  }
}, { passive: false });

glCanvas.addEventListener('touchend', (e) => {
  if (e.touches.length === 0) touchDragging = false;
  if (e.touches.length === 1) {
    touchDragging = true;
    dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    viewStart = { cx: view.cx, cy: view.cy };
  }
});

// ===================== Controls =====================
fractalSelect.addEventListener('change', () => {
  juliaControls.style.display = fractalSelect.value === 'julia' ? 'flex' : 'none';
  resetView();
});

juliaCR.addEventListener('input', () => { juliaCRVal.textContent = juliaCR.value; scheduleRender(); });
juliaCI.addEventListener('input', () => { juliaCIVal.textContent = juliaCI.value; scheduleRender(); });
resetBtn.addEventListener('click', resetView);
window.addEventListener('resize', resize);

// ===================== Init =====================
resize();
resetView();
</script>
</body>
</html>
